{{define "content"}}
<h1>Upcoming events</h1>

{{if not .Events}}
  <p>No events are planned right now. Check back soon.</p>
{{else}}
  <ul class="event-list">
    {{- range .Events}}
      <li class="event-card">
        <h2><a href="/events/{{.ID}}">{{.Title}}</a></h2>
        <p class="event-when">{{.Day}} · {{.Times}}</p>
        <p class="event-where">{{.Location}}</p>
        {{- if .Full}}
          <p><strong class="badge">Full</strong></p>
        {{- end}}
      </li>
    {{- end}}
  </ul>
{{end}}
{{end}}
