{{define "content"}}
<h1>Organizers</h1>

<form method="post" action="/signin" class="form form-narrow" novalidate>
  <input type="hidden" name="next" value="{{.Next}}">

  {{- with .Error}}
    <p class="notice notice-error" role="alert" id="password-error">{{.}}</p>
  {{- end}}

  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required{{if .Error}} aria-invalid="true" aria-describedby="password-error"{{end}}>
  </div>

  <button type="submit" class="button">Sign in</button>
</form>
{{end}}
