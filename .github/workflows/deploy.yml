# The pipeline from design/delivery.md: test → gate → deploy → smoke test → tag (D-017).
# main deploys the Go version to AWS: GitHub signs in with OIDC, with no stored keys, and
# CDK deploys infra/. Where it deploys comes from the "aws" GitHub environment (D-024).
# The tests and gate run before every deploy unless switched off (D-027).
# The archived PHP version is on the lamp branch, and deploys from there only by hand.
name: Deploy

on:
  push:
    branches: [main]
    # A push that only changes documentation has nothing to deploy.
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the tests and the accessibility gate before deploying
        type: boolean
        default: true

# One deploy at a time, in push order, and a running deploy is never cancelled (D-013).
concurrency:
  group: deploy-aws
  cancel-in-progress: false

permissions:
  contents: read

# Git on the runner names new branches "main", like this repo, so checkout doesn't warn about "master".
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # On by default. Off for one run by unticking the Run workflow checkbox, or for every
  # push with the repository variable RUN_TESTS set to false.
  test:
    name: Test and gate
    if: (github.event_name == 'workflow_dispatch' && inputs.run_tests) || (github.event_name != 'workflow_dispatch' && vars.RUN_TESTS != 'false')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # The real DynamoDB code runs against DynamoDB Local, shared by two copies of the site.
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      SITE_TABLE: php2go-test
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      ORGANIZER_PASSWORD: contract-test-password
      CLUB_NAME: Riverside Community Club
      CLUB_TIMEZONE: America/Chicago
      # Tests submit forms instantly, so the bot timer is off here (D-011).
      FORM_MIN_SECONDS: '0'
      # A release ID shaped like a real one, so the release tests compare something real.
      RELEASE: r${{ github.run_number }}+ci
      BASE_URL: http://127.0.0.1:8080
      ALT_BASE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            infra/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Go tests
        run: |
          go vet ./...
          go test ./...

      - name: Infrastructure tests (cost traps, deploy role, Free plan)
        working-directory: infra
        run: |
          go vet ./...
          go test ./...

      - name: Start the site on empty storage
        run: |
          go build -o dist/site ./cmd/site
          wait_for() {
            for _ in $(seq 1 30); do
              curl -fsS "$1/health" && return 0
              sleep 1
            done
            echo "::error::The site at $1 didn't start"
            return 1
          }
          PORT=8080 dist/site > server.log 2>&1 &
          wait_for "$BASE_URL"
          # A second copy on the same storage with another password, for the password-change test.
          PORT=8081 ORGANIZER_PASSWORD=a-changed-password dist/site > server-alt.log 2>&1 &
          wait_for "$ALT_BASE_URL"

      - name: Acceptance tests
        run: node --test --test-concurrency=1 'tests/contract/*.test.mjs'

      # GitHub's Ubuntu mirror sometimes stalls mid-download. With these, a stalled download
      # times out in seconds and is retried, instead of hanging the step.
      - name: Make apt retry stalled downloads
        run: |
          sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null <<'APT'
          Acquire::Retries "5";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT

      - name: Install the gate's browsers
        working-directory: tests/gate
        # A stalled download from the Ubuntu mirror fails here in minutes, not after the job's limit.
        timeout-minutes: 10
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit

      - name: Accessibility and layout gate
        working-directory: tests/gate
        timeout-minutes: 12
        run: npx playwright test

      - name: Show the server logs
        if: failure()
        run: cat server.log server-alt.log

  deploy:
    name: Deploy to AWS
    needs: test
    # Runs when the tests passed or were switched off, never when they failed.
    if: github.ref == 'refs/heads/main' && !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: aws
    permissions:
      id-token: write # lets the job ask GitHub for an OIDC token to sign in to AWS
      contents: write # tag and GitHub Release (D-016)
    env:
      # Each setting can be an environment secret or variable; a secret wins, and its value
      # is shown as *** in every log, because a public repo's Actions logs are public too.
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      CLUB_NAME: ${{ secrets.CLUB_NAME || vars.CLUB_NAME }}
      CLUB_TIMEZONE: ${{ secrets.CLUB_TIMEZONE || vars.CLUB_TIMEZONE }}
      SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
      FREE_PLAN_WEB_ACL_ARN: ${{ secrets.FREE_PLAN_WEB_ACL_ARN || vars.FREE_PLAN_WEB_ACL_ARN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the aws environment's settings
        id: settings
        env:
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          ORGANIZER_PASSWORD: ${{ secrets.ORGANIZER_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          echo "RELEASE=r${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::notice::AWS isn't connected yet (no AWS_ROLE_ARN in the aws environment), so nothing was deployed. See platform/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=0
          for name in AWS_ACCOUNT_ID AWS_REGION CLUB_NAME CLUB_TIMEZONE ORIGIN_SECRET ORGANIZER_PASSWORD SESSION_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::The aws environment is missing $name. See platform/README.md."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          if [ -f .github/dry-run ]; then
            echo "DRY_RUN=1" >> "$GITHUB_ENV"
            echo "::notice::Dry run: .github/dry-run is present, so only cdk diff runs and nothing in AWS changes."
          else
            echo "DRY_RUN=0" >> "$GITHUB_ENV"
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        if: steps.settings.outputs.ready == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            infra/go.sum

      - uses: actions/setup-node@v7
        if: steps.settings.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Install the CDK CLI
        if: steps.settings.outputs.ready == 'true'
        run: npm install -g aws-cdk@2.1146.1

      - name: Build the Lambda (Linux, arm64)
        if: steps.settings.outputs.ready == 'true'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -trimpath \
            -ldflags "-s -w -X github.com/ejarvi/php2go-demo/internal/platform.ReleaseID=${RELEASE}" \
            -o dist/lambda/bootstrap ./cmd/site
          ls -l dist/lambda

      - name: Sign in to AWS (OIDC)
        if: steps.settings.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: php2go-deploy-${{ github.run_number }}

      - name: "Safety: signed in to the right account"
        if: steps.settings.outputs.ready == 'true'
        run: |
          got=$(aws sts get-caller-identity --query Account --output text)
          if [ "$got" != "$AWS_ACCOUNT_ID" ]; then
            echo "::error::Signed in to a different account than AWS_ACCOUNT_ID. Stopping."
            exit 1
          fi
          echo "Signed in to the expected account."

      # The secrets go from GitHub to SSM Parameter Store, in memory only: environment
      # variables → an SDK call, never a file or a command argument.
      - name: Write the secrets to SSM Parameter Store
        if: steps.settings.outputs.ready == 'true' && env.DRY_RUN == '0'
        env:
          ORGANIZER_PASSWORD: ${{ secrets.ORGANIZER_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: go run ./cmd/secrets

      - name: Preview the changes (cdk diff)
        if: steps.settings.outputs.ready == 'true'
        working-directory: infra
        env:
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
        run: cdk diff Php2go

      - name: Deploy (cdk deploy)
        if: steps.settings.outputs.ready == 'true' && env.DRY_RUN == '0'
        working-directory: infra
        env:
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
        # CDK prints the stack's outputs, the site's and the function's addresses. In a public repo
        # the log is public, so the output is held back until those values are masked.
        run: |
          status=0
          cdk deploy Php2go --require-approval never --outputs-file ../cdk-outputs.json > ../cdk-deploy.log 2>&1 || status=$?
          if [ -f ../cdk-outputs.json ]; then
            for url in $(jq -r '.Php2go | .SiteUrl, .FunctionUrl' ../cdk-outputs.json); do
              host=${url#https://}
              echo "::add-mask::$url"
              echo "::add-mask::${url%/}"
              echo "::add-mask::${host%/}"
            done
          fi
          cat ../cdk-deploy.log
          exit $status

      - name: Smoke test
        if: steps.settings.outputs.ready == 'true' && env.DRY_RUN == '0'
        run: |
          site=$(jq -r '.Php2go.SiteUrl' cdk-outputs.json)
          fnurl=$(jq -r '.Php2go.FunctionUrl' cdk-outputs.json)
          echo "### The site is live, running $RELEASE" >> "$GITHUB_STEP_SUMMARY"
          body=""
          ok=0
          for _ in $(seq 1 18); do
            body=$(curl -fsS "$site/health" || true)
            if jq -e --arg release "$RELEASE" '.status == "ok" and .release == $release' <<< "$body" > /dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "::error::$site/health didn't report release $RELEASE. Last answer: $body"
            exit 1
          fi
          echo "The live site is running $RELEASE, and can read its storage."
          curl -fsSI "$site/" | tr -d '\r' | grep -i '^referrer-policy: same-origin' > /dev/null \
            || { echo "::error::The security headers are missing"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' "$fnurl")
          if [ "$code" != 403 ]; then
            echo "::error::The function URL answered $code without CloudFront's header; expected 403"
            exit 1
          fi
          echo "The function URL refuses direct requests ($code)."

      - name: Tag the release
        if: steps.settings.outputs.ready == 'true' && env.DRY_RUN == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE" > /dev/null 2>&1; then
            echo "$RELEASE already exists, from an earlier attempt at this deploy."
            exit 0
          fi
          gh release create "$RELEASE" --target "$GITHUB_SHA" --title "$RELEASE" --generate-notes
